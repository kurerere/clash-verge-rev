name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    # Check the three-day cadence daily; cron day-of-month steps reset each month.
    - cron: '17 2 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'kurerere/clash-verge-rev' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check three-day cadence
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          elapsed_days=$(( ($(date -u +%s) - $(date -u -d '2026-11-15' +%s)) / 86400 ))
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || (( elapsed_days % 3 == 0 )); then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Not due: upstream is checked every three days from 2026-11-15.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify sync credentials and release workflow
        if: steps.cadence.outputs.due == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo '::error::Set UPSTREAM_SYNC_TOKEN with Contents and Workflows read/write permissions. GITHUB_TOKEN cannot sync workflow changes or trigger tag builds.'
            exit 1
          fi
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fork-release.yml" --jq '.state')
          if [[ "$state" != active ]]; then
            echo '::error::Enable Fork Release before syncing upstream.'
            exit 1
          fi

      - name: Checkout fork
        if: steps.cadence.outputs.due == 'true'
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge upstream and push next fork release tag
        if: steps.cadence.outputs.due == 'true'
        run: bash scripts-workflow/sync-upstream.sh
